version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: securepay-postgres
    restart: always
    environment:
      POSTGRES_DB: securepay_db
      POSTGRES_USER: securepay_user
      POSTGRES_PASSWORD: securepay_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
