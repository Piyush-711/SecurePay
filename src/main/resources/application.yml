server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: SecurePay-API

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/securepay_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

securepay:
  jwt:
    # 256-bit secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  rate-limiting:
    default-requests-per-minute: 60
  idempotency:
    ttl-minutes: 1440 # 24 hours

logging:
  level:
    com.securepay: INFO
    org.springframework.security: INFO
